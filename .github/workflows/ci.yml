name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ml:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.12.19
      - name: Install locked optional CPU ML dependencies
        run: uv sync --frozen --extra dev --extra ml
      - name: Verify synthetic training, export and data safeguards
        run: .venv/bin/python -m pytest -q tests/test_ml_data.py tests/test_ml_reader.py
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify locked browser dependency assets
        run: |
          npm ci --ignore-scripts
          npm run build
          git diff --exit-code -- src/psychomark/static/vendor
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install uv==0.12.19
      - name: Install locked dependencies
        run: uv sync --frozen --python ${{ matrix.python }} --extra dev --extra browser
      - name: Lint, format, documentation and tests
        run: .venv/bin/python scripts/dev.py check
      - name: Install Chromium
        if: matrix.python == '3.12'
        run: .venv/bin/python -m playwright install --with-deps chromium
      - name: Browser workflow
        if: matrix.python == '3.12'
        run: .venv/bin/python scripts/dev.py browser
      - name: Codespaces startup and live reload
        if: matrix.python == '3.12'
        run: .venv/bin/python scripts/dev.py live

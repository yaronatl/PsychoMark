[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "psychomark"
version = "0.1.0"
description = "Deterministic, template-based OMR for practice exam answer sheets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=11.0,<13",
  "pydantic>=2.10,<3",
  "pypdfium2>=4.30,<6",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.14,<1"]
browser = ["playwright>=1.56,<2"]

[project.scripts]
psychomark = "psychomark.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["src/psychomark"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
